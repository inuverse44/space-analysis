[project]
name = "space-analysis"
version = "0.1.0"
description = "地球の電波はどの星まで届いたか（恒星・系外惑星データの集計）"
authors = [
    { name = "Inuverse" }
]
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
]

[project.scripts]
space-analysis = "space_analysis:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# レポートの文章のテンプレートは、日本語の文を途中で折らない
"src/space_analysis/report.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
